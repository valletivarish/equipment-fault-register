# One public origin: static React build at /, FastAPI (loopback only) at /api/.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /opt/fault-register/current/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 64k;

    # No URI on proxy_pass keeps the /api/ prefix, which FastAPI routes expect.
    # expires -1 stops browsers caching CRUD responses.
    location /api/ {
        # fault_register_api is written by the deploy script and names the live slot.
        proxy_pass http://fault_register_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        expires -1;
    }

    # Vite hashes asset names, so they can be cached for a year safely.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # React routes such as /faults/12 fall back to index.html. /api/ is matched
    # above, so API errors are never masked by the HTML page.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
