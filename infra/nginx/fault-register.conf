# Single public origin for the fault register (deployment Option A).
# Nginx serves the built React files and forwards only /api/ to FastAPI,
# which listens on the loopback interface and is never exposed directly.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /opt/fault-register/current/dist;
    index index.html;

    # Compressing text assets cuts bytes sent per page view.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 64k;

    # The /api/ prefix is kept when forwarding because FastAPI routes include it.
    # expires -1 marks CRUD responses as not cacheable.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        expires -1;
    }

    # Vite puts a content hash in every asset file name, so browsers can keep
    # them for a long time and only download files that actually changed.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Deep links such as /faults/12 are React routes: serve index.html for any
    # path that is not a real file. /api/ is matched above, so API errors are
    # never hidden behind the HTML page.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
